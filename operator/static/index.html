<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator Kiloview</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Feeddesk</p>
      <h1>Operator Kiloview</h1>
    </div>
    <div class="who">
      <span id="user"></span>
      <a id="logout" href="/logout" hidden>Keluar</a>
    </div>
  </header>

  <main>
    <section>
      <div class="section-head split">
        <div>
          <h2>Sumber</h2>
          <p>Seret nama sumber ke slot SDI. Nama tampilan dan port SRT bisa diubah. Sumber baru langsung didaftarkan ke MediaMTX.</p>
        </div>
        <button type="button" id="add-source">Tambah sumber</button>
      </div>
      <form id="source-form" class="editor" hidden>
        <label>Nama tampilan
          <input name="label" maxlength="48" required>
        </label>
        <label>ID path
          <input name="id" maxlength="41" required>
        </label>
        <label>Port SRT
          <input name="port" type="number" min="1024" max="65535" required>
        </label>
        <div class="editor-actions">
          <button type="submit">Simpan</button>
          <button type="button" id="delete-source" hidden>Hapus</button>
          <button type="button" id="cancel-source">Batal</button>
        </div>
      </form>
      <div id="sources" class="sources"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>Keluaran SDI</h2>
        <p>Preview di slot ini memakai sumber dan peta audio yang sama dengan kabel SDI. Volume hanya untuk dengar di halaman ini.</p>
      </div>
      <div id="slots" class="slots"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
