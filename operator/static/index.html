<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STREAM ROUTE</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">STREAM</p>
      <h1>STREAM ROUTE</h1>
    </div>
    <div class="who">
      <span id="user"></span>
      <a id="logout" href="/logout" hidden>Log out</a>
    </div>
  </header>

  <main>
    <section class="inputs">
      <div class="section-head split">
        <div>
          <h2>Inputs</h2>
          <p id="inputs-note">Drag a name onto an SDI slot.</p>
        </div>
        <button type="button" id="add-source" hidden>Add input</button>
      </div>
      <form id="source-form" class="editor" hidden>
        <label>Display name
          <input name="label" maxlength="48" required>
        </label>
        <label>Path ID
          <input name="id" maxlength="41" required>
        </label>
        <label>Connection
          <select name="mode">
            <option value="caller">Caller — this server calls the remote</option>
            <option value="listener">Listener — wait on a port you choose</option>
          </select>
        </label>
        <label data-field="url">Remote URL
          <input name="url" type="text" maxlength="300" spellcheck="false" autocomplete="off" placeholder="srt://127.0.0.1:3001?mode=listener" required>
        </label>
        <label data-field="port" hidden>Listen port
          <input name="port" type="number" min="1024" max="65535" inputmode="numeric">
          <span class="field-note">The sender calls this server on that UDP port, for example srt://172.17.20.34:9101. Other live inputs stay up.</span>
        </label>
        <div class="editor-actions">
          <button type="submit">Save</button>
          <button type="button" id="delete-source" hidden>Delete</button>
          <button type="button" id="cancel-source">Cancel</button>
        </div>
      </form>
      <div id="sources" class="sources"></div>
    </section>

    <section class="outputs">
      <div class="section-head">
        <h2>SDI outputs</h2>
        <p>The preview uses the same source and audio map as the SDI cable. Volume is only for listening on this page.</p>
      </div>
      <div id="slots" class="slots"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
