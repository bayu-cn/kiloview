# Butuh driver Blackmagic yang sudah jalan di host, karena kartu SDI tidak bisa
# dipindah ke dalam image. Network host supaya 127.0.0.1 menuju MediaMTX.
services:
  operator:
    build: .
    image: kiloview-operator
    container_name: operator
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      DATA_DIR: /data
      GST_LAUNCH: /host-usr/bin/gst-launch-1.0
      LD_LIBRARY_PATH: /host-usr/lib/x86_64-linux-gnu:/host-usr/lib:/host-lib/x86_64-linux-gnu
      GST_PLUGIN_PATH: /host-usr/lib/x86_64-linux-gnu/gstreamer-1.0
      GST_PLUGIN_SYSTEM_PATH: /host-usr/lib/x86_64-linux-gnu/gstreamer-1.0
    volumes:
      - ./config.env:/app/config.env:ro
      - ./data:/data
      - /dev:/dev
      - /usr:/host-usr:ro
      - /lib:/host-lib:ro
